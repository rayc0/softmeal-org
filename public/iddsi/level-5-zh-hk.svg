<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 240" width="200" height="240"
     role="img" aria-label="IDDSI Level 5 – Minced & Moist">
  <title>IDDSI Level 5 – Minced & Moist</title>

  <!-- card background (congee cream) -->
  <rect width="200" height="240" rx="14" fill="#FFF8ED"/>

  <!-- colour header band -->
  <clipPath id="top-clip-5-zh-hk">
    <rect width="200" height="240" rx="14"/>
  </clipPath>
  <rect width="200" height="68" fill="#EE2A24"
        clip-path="url(#top-clip-5-zh-hk)"/>

  <!-- IDDSI wordmark -->
  <text x="100" y="18" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="700"
        letter-spacing="3" fill="#FFFFFF">IDDSI</text>

  <!-- level number -->
  <text x="100" y="48" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial,sans-serif" font-size="38" font-weight="900"
        fill="#FFFFFF">5</text>

  <!-- visual motif -->
  
  <!-- minced motif -->
  <!-- fork handle -->
  <line x1="90" y1="145" x2="90" y2="165" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- fork head -->
  <rect x="78" y="90" width="24" height="40" rx="4" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="84" y1="90" x2="84" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="96" y1="90" x2="96" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- crumble dots -->
  <circle cx="130" cy="95"  r="5" fill="#EE2A2433" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="145" cy="108" r="4" fill="#EE2A2433" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="128" cy="118" r="6" fill="#EE2A2433" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="143" cy="128" r="5" fill="#EE2A2433" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="133" cy="140" r="4" fill="#EE2A2433" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- locale label -->
  <text x="100" y="198" text-anchor="middle" dominant-baseline="middle"
      font-family="'Noto Sans CJK SC','Noto Sans',Arial,sans-serif"
      font-size="18" font-weight="600" fill="#1A1A1A">碎粒帶汁</text>

  <!-- English subtitle (non-English locales) -->
  <text x="100" y="220" text-anchor="middle" dominant-baseline="middle"
    font-family="Arial,sans-serif" font-size="10" fill="#888888">Minced & Moist</text>

  <!-- card outline — 1.5px ink stroke -->
  <rect x="0.75" y="0.75" width="198.5" height="238.5" rx="13.5"
        fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
